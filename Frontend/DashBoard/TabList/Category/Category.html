<div class="category-page-container">
    <link rel="stylesheet" href="TabList/Category/Category.css">

    <div class="page-toolbar">
        <div class="search-bar">
            <span>🔍</span>
            <input type="text" id="catSearchInput" placeholder="Tìm danh mục..." onkeyup="window.searchCategory()">
        </div>
        <button class="btn-add-new" onclick="window.openAddCategoryModal()">+ Thêm danh mục</button>
    </div>

    <div class="table-responsive">
        <table class="data-table">
            <thead>
                <tr>
                    <th width="5%">ID</th>
                    <th width="10%">Hình ảnh</th>
                    <th width="25%">Tên danh mục</th>
                    <th width="20%">Slug</th>
                    <th width="10%">Thứ tự</th>
                    <th width="15%">Trạng thái</th>
                    <th width="15%">Hành động</th>
                </tr>
            </thead>
            <tbody id="categoryTableBody">
                <tr><td colspan="7" style="text-align:center">Đang tải...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div id="categoryModal" class="modal-overlay hidden">
    <div class="modal-box">
        <div class="modal-header">
            <h3 id="catModalTitle">Danh mục</h3>
            <span class="close-modal" onclick="window.closeCategoryModal()">✕</span>
        </div>
        
        <div class="modal-body">
            <form id="categoryForm">
                <input type="hidden" id="catId">

                <div class="form-group">
                    <label>Tên danh mục <span style="color:red">*</span></label>
                    <input type="text" id="catName" required placeholder="VD: Rau củ quả">
                </div>

                <div class="form-group">
                    <label>Slug (Đường dẫn) <small style="color:#888">- Tự động tạo nếu để trống</small></label>
                    <input type="text" id="catSlug" placeholder="VD: rau-cu-qua">
                </div>

                <div class="form-row">
                    <div class="form-group half">
                        <label>Thứ tự hiển thị</label>
                        <input type="number" id="catOrder" value="0">
                    </div>
                    <div class="form-group half">
                        <label>Hình ảnh</label>
                        <input type="file" id="catImageInput">
                    </div>
                </div>

                <div class="form-group">
                    <label>Mô tả</label>
                    <textarea id="catDesc" rows="2"></textarea>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="catActive" checked> Hiển thị trên web
                    </label>
                </div>
            </form>
        </div>

        <div class="modal-footer">
            <button class="btn-cancel" onclick="window.closeCategoryModal()">Hủy</button>
            <button class="btn-save" onclick="window.saveCategory()">Lưu lại</button>
        </div>
    </div>
</div>
