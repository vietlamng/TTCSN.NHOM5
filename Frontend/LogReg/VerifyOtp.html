<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xác thực tài khoản</title>
  <link rel="stylesheet" href="style/logReg.css" />
  <style>
    .verify-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      padding: 2rem 1rem;
    }

    .verify-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
      width: min(420px, 100%);
      padding: 2.5rem;
      text-align: center;
    }

    .verify-card h1 {
      margin-bottom: 0.5rem;
      font-size: 1.8rem;
      color: #1e1f22;
    }

    .verify-card p {
      color: #5c5f66;
      margin-bottom: 2rem;
    }

    .verify-card label {
      display: block;
      text-align: left;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: #30323a;
    }

    .verify-card input {
      width: 100%;
      padding: 0.9rem 1rem;
      border: 1px solid #dfe3eb;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      transition: border 0.2s ease, box-shadow 0.2s ease;
    }

    .verify-card input:focus {
      border-color: #7a5af8;
      box-shadow: 0 0 0 3px rgba(122, 90, 248, 0.15);
    }

    .verify-card button {
      width: 100%;
      margin-top: 1.5rem;
      padding: 0.95rem;
      border: none;
      border-radius: 14px;
      background: #7a5af8;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .verify-card button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .verify-card button:not(:disabled):hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 20px rgba(122, 90, 248, 0.25);
    }

    .status-text {
      min-height: 1.2rem;
      margin-top: 1rem;
      font-size: 0.95rem;
    }

    .back-link {
      display: inline-block;
      margin-top: 1.2rem;
      color: #7a5af8;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
  <link rel="stylesheet" href="/Frontend/theme-refresh.css">
</head>

<body>
  <div class="verify-wrapper">
    <div class="verify-card">
      <h1>Xác thực tài khoản</h1>
      <p>Nhập email và mã OTP đã được gửi tới hộp thư của bạn.</p>
      <form id="verify-form">
        <label for="verify-email">Email</label>
        <input type="email" id="verify-email" placeholder="you@example.com" required />

        <label for="verify-otp">Mã OTP</label>
        <input type="text" id="verify-otp" placeholder="Nhập 6 ký tự OTP" maxlength="6" required />

        <button type="submit" id="verify-submit">Xác thực</button>
        <p id="verify-message" class="status-text"></p>
      </form>
      <a class="back-link" href="LogRegUI.html">← Quay lại đăng nhập</a>
    </div>
  </div>

  <script src="script/verifyOtp.js"></script>
</body>

</html>
