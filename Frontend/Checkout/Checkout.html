<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Thanh toán - HLPTT</title>
    <link rel="stylesheet" href="/Frontend/TrangChu/trangchu.css" />
    <!-- Bootstrap 5 utility -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        /* Header Full Width Override */
        header {
            position: relative;
            width: 100vw;
            left: 50%;
            right: 50%;
            margin-left: -50vw;
            margin-right: -50vw;
            margin-top: -30px;
            margin-bottom: 30px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
            margin: 0;
            padding: 30px 20px;
        }

        .checkout-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 30px;
        }

        .section {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07);
            transition: box-shadow 0.3s ease;
        }

        .section:hover {
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }

        .order-list-container {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .order-list-container::-webkit-scrollbar {
            width: 8px;
        }

        .order-list-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        .order-list-container::-webkit-scrollbar-thumb {
            background: #16a34a;
            border-radius: 4px;
        }

        .order-list-container::-webkit-scrollbar-thumb:hover {
            background: #15803d;
        }

        h2 {
            font-size: 20px;
            font-weight: 700;
            color: #1a202c;
            border-bottom: 2px solid #16a34a;
            padding-bottom: 12px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #16a34a;
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.1);
        }

        .order-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }

        .order-table thead th {
            background: #f9fafb;
            padding: 12px 10px;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            border-bottom: 2px solid #e5e7eb;
        }

        .order-table tbody td {
            padding: 15px 10px;
            border-bottom: 1px solid #f3f4f6;
            font-size: 14px;
        }

        .order-table tbody tr:hover {
            background: #f9fafb;
        }

        .order-summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
            color: #4b5563;
            padding: 8px 0;
        }

        .total-row {
            font-size: 20px;
            font-weight: 800;
            color: #ef4444;
            border-top: 2px solid #e5e7eb;
            padding-top: 15px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3);
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #15803d 0%, #166534 100%);
            box-shadow: 0 6px 20px rgba(22, 163, 74, 0.4);
            transform: translateY(-2px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .payment-method {
            margin-top: 15px;
        }

        .payment-option {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #f9fafb;
        }

        .payment-option:hover {
            border-color: #16a34a;
            background: #f0fdf4;
        }

        .payment-option.selected {
            border-color: #16a34a;
            background: #dcfce7;
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.1);
        }

        @media (max-width: 1024px) {
            .checkout-container {
                gap: 20px;
            }

            .section {
                padding: 20px;
            }
        }

        @media (max-width: 768px) {
            .checkout-container {
                flex-direction: column;
            }

            body {
                padding: 15px 10px;
            }

            .order-table thead th:nth-child(3),
            .order-table tbody td:nth-child(3) {
                display: none; /* Ẩn cột đơn giá trên mobile */
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 8px;
            }

            .section {
                padding: 16px;
            }

            h2 {
                font-size: 17px;
            }

            .total-row {
                font-size: 16px;
            }

            .btn-submit {
                font-size: 14px;
                padding: 13px;
            }
        }
    </style>
  <link rel="stylesheet" href="/Frontend/theme-refresh.css">
</head>

<body>
    <!-- Header -->
    <header>
        <div class="header-content">
            <a class="logo" href="/Frontend/TrangChu/trangchu.html">
                <img src="/Frontend/TrangChu/logo.jpg" alt="HLPTT">
            </a>
            <div class="search-bar">
                <input id="searchInput" placeholder="Tìm kiếm sản phẩm..." type="text" />
                <button id="searchButton">🔍</button>
            </div>
            <div class="header-icons">
                <div class="icon-item" onclick="window.location.href='/Frontend/GioHang/giohang.html'"
                    style="cursor:pointer">
                    <div class="icon">
                        🛒
                        <span class="badge" id="cartBadge">0</span>
                    </div>
                    <span class="text">Giỏ hàng</span>
                </div>
            </div>
        </div>
    </header>

    <div class="checkout-container">
        <!-- Order Summary LEFT -->
        <div style="flex: 1;">
            <div class="section">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h2 style="margin: 0;">📦 Đơn hàng của bạn</h2>
                    <button onclick="clearCart()"
                        style="background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 12px;">
                        🗑️ Xóa giỏ hàng
                    </button>
                </div>
                <div id="orderItemsSummary">
                </div>
                <hr style="border: 0; border-top: 1px solid #eee;">
                <div class="order-summary-item">
                    <span>Tạm tính:</span>
                    <span id="tempTotal">0đ</span>
                </div>
                <div class="order-summary-item" style="color: green;">
                    <span>Giảm giá:</span>
                    <span id="discountAmount">-0đ</span>
                </div>
                <div class="total-row">
                    <span>Tổng cộng:</span>
                    <span id="finalTotal">0đ</span>
                </div>

                <hr style="border: 0; border-top: 2px solid #eee; margin: 20px 0;">

                <h2 style="font-size: 18px; margin-bottom: 15px;">💳 Phương thức thanh toán</h2>
                <div class="payment-method">
                    <label class="payment-option selected" onclick="selectPayment('cod')">
                        <input type="radio" name="payment" value="cod" checked>
                        <span style="margin-left: 10px;">💰 Thanh toán khi nhận hàng (COD)</span>
                    </label>
                    <label class="payment-option" onclick="selectPayment('vnpay')">
                        <input type="radio" name="payment" value="vnpay">
                        <span style="margin-left: 10px;">🏦 Thanh toán qua VNPAY</span>
                    </label>
                </div>

                <button class="btn-submit" onclick="processCheckout()" style="margin-top: 20px;">ĐẶT HÀNG NGAY</button>
                <a href="../GioHang/GioHang.html"
                    style="display: block; text-align: center; margin-top: 10px; color: #666; text-decoration: none;">←
                    Quay
                    lại giỏ hàng</a>
            </div>
        </div>

        <!-- Shipping Form RIGHT -->
        <div style="flex: 1.5;">
            <div class="section">
                <h2>🚚 Thông tin giao hàng</h2>
                <div class="form-group">
                    <label>Họ và tên</label>
                    <input type="text" id="fullName" class="form-control" placeholder="Nhập họ tên của bạn">
                </div>
                <div class="form-group">
                    <label>Số điện thoại</label>
                    <input type="text" id="phone" class="form-control" placeholder="Nhập số điện thoại">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" class="form-control" placeholder="Nhập email của bạn">
                </div>
                <div class="form-group">
                    <label>Địa chỉ nhận hàng</label>
                    <input type="text" id="address" class="form-control" placeholder="Số nhà, đường, phường, quận...">
                </div>
                <div class="form-group">
                    <label>Ghi chú đơn hàng (Tùy chọn)</label>
                    <textarea id="note" class="form-control" rows="3"
                        placeholder="Ví dụ: Giao giờ hành chính"></textarea>
                </div>
            </div>
        </div>
    </div>

    <script src="Checkout.js"></script>
</body>

</html>
