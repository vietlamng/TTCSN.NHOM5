<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết quả thanh toán - HLPTT</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .result-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        .success-icon { color: #28a745; }
        .fail-icon { color: #dc3545; }
        
        h1 { margin-bottom: 10px; color: #333; }
        p { color: #666; margin-bottom: 30px; line-height: 1.5; }
        
        .order-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            text-align: left;
            font-size: 14px;
        }
        .order-info div { margin-bottom: 5px; }
        .btn {
            display: block;
            width: 100%;
            padding: 12px 0;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
            box-sizing: border-box;
        }
        .btn-home {
            background-color: #008848;
            color: white;
        }
        .btn-home:hover { background-color: #006d3a; }
        
        .btn-retry {
            background-color: #ffc107;
            color: #333;
            margin-top: 10px;
        }
        .hidden { display: none; }
    </style>
  <link rel="stylesheet" href="/Frontend/theme-refresh.css">
</head>
<body>

    <div class="result-card">
        <div id="successView" class="hidden">
            <div class="icon success-icon">🎉</div>
            <h1>Thanh toán thành công!</h1>
            <p>Cảm ơn bạn đã mua sắm tại HLPTT. Đơn hàng của bạn đã được xác nhận.</p>
        </div>

        <div id="failView" class="hidden">
            <div class="icon fail-icon">😢</div>
            <h1>Thanh toán thất bại</h1>
            <p>Giao dịch chưa hoàn tất hoặc bị hủy. Vui lòng thử lại hoặc liên hệ CSKH.</p>
        </div>

        <div class="order-info" id="orderInfoBox">
            <div>Mã đơn hàng: <strong id="orderId">...</strong></div>
            <div>Thời gian: <span id="time">...</span></div>
        </div>

        <a href="../TrangChu/trangchu.html" class="btn btn-home">Về trang chủ</a>
        <a href="../Checkout/Checkout.html" id="retryBtn" class="btn btn-retry hidden">Thử lại thanh toán</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const status = urlParams.get('status');
            const orderCode = urlParams.get('orderCode') || 'Không xác định';
            
            document.getElementById('orderId').textContent = orderCode;
            document.getElementById('time').textContent = new Date().toLocaleString('vi-VN');

            if (status === 'success') {
                document.getElementById('successView').classList.remove('hidden');
                
                localStorage.removeItem("cartItems");
                localStorage.removeItem("appliedCoupon");
                localStorage.removeItem("discountAmount");
                localStorage.removeItem("appliedCouponPercent");
                
            } else {
                document.getElementById('failView').classList.remove('hidden');
                document.getElementById('retryBtn').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
