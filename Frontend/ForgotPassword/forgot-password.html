<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - HLPTT</title>
    <link rel="stylesheet" href="forgot-password.css">
  <link rel="stylesheet" href="/Frontend/theme-refresh.css">
</head>

<body>
    <div class="container">
        <!-- Step 1: Enter Email -->
        <div class="form-container" id="emailStep">
            <div class="form-blob">
                <img src="../LogReg/asset/blob.svg" alt="blob" class="blob-image blob1" />
                <img src="../LogReg/asset/blob.svg" alt="blob" class="blob-image blob2" />
                <img src="../LogReg/asset/blob.svg" alt="blob" class="blob-image blob3" />
            </div>

            <div class="form-header">
                <p>Khôi phục tài khoản</p>
                <h1>Quên mật khẩu?</h1>
                <p class="subtitle">Nhập email để nhận mã xác thực</p>
            </div>

            <form class="form-box" id="emailForm">
                <div class="input-group">
                    <input type="email" id="email" class="input-field" placeholder=" " required />
                    <label for="email" class="floating-label">Địa chỉ email</label>
                </div>

                <p id="email-message" class="status-text"></p>

                <button type="submit" class="form-btn form-btn--submit" id="sendCodeBtn">
                    Gửi mã xác thực
                </button>

                <div class="form-bottom">
                    <p>
                        Nhớ mật khẩu?
                        <a href="../LogReg/LogRegUI.html" class="form-link">Đăng nhập</a>
                    </p>
                </div>
            </form>
        </div>

        <!-- Step 2: Reset Password -->
        <div class="form-container hidden" id="resetStep">
            <div class="form-blob">
                <img src="../LogReg/asset/blob.svg" alt="blob" class="blob-image blob1" />
                <img src="../LogReg/asset/blob.svg" alt="blob" class="blob-image blob2" />
                <img src="../LogReg/asset/blob.svg" alt="blob" class="blob-image blob3" />
            </div>

            <div class="form-header">
                <p>Bước cuối</p>
                <h1>Đặt mật khẩu mới</h1>
                <p class="subtitle">Nhập mã xác thực và mật khẩu mới</p>
            </div>

            <form class="form-box" id="resetForm">
                <div class="input-group">
                    <input type="text" id="resetCode" class="input-field code-input" placeholder=" " required
                        maxlength="6" />
                    <label for="resetCode" class="floating-label">Mã xác thực (6 số)</label>
                </div>

                <div class="input-group">
                    <input type="password" id="newPassword" class="input-field" placeholder=" " required />
                    <label for="newPassword" class="floating-label">Mật khẩu mới</label>
                    <div class="eye-icon" id="toggleNewPassword">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-eye">
                            <path
                                d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </div>
                </div>

                <div class="input-group">
                    <input type="password" id="confirmPassword" class="input-field" placeholder=" " required />
                    <label for="confirmPassword" class="floating-label">Xác nhận mật khẩu</label>
                    <div class="eye-icon" id="toggleConfirmPassword">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-eye">
                            <path
                                d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </div>
                </div>

                <p id="password-match-error" class="error-text"></p>
                <p id="reset-message" class="status-text"></p>

                <button type="submit" class="form-btn form-btn--submit" id="resetBtn">
                    Đặt lại mật khẩu
                </button>

                <div class="form-bottom">
                    <p>
                        Chưa nhận được mã?
                        <a href="#" class="form-link" id="resendCode">Gửi lại (<span id="countdown">60</span>s)</a>
                    </p>
                    <p>
                        <a href="../LogReg/LogRegUI.html" class="form-link">Quay lại đăng nhập</a>
                    </p>
                </div>
            </form>
        </div>
    </div>

    <script src="forgot-password.js"></script>
</body>

</html>
