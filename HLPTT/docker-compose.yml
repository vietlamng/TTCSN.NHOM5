version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: hlptt-db-dev
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: HLPTT
    volumes:
      - hlptt_db_data:/var/lib/mysql
    networks:
      - hlptt-network

  php-app:
    image: php:8.2-apache
    container_name: hlptt-php
    ports:
      - "8090:80"
    volumes:
      - ./php-src:/var/www/html 
    depends_on:
      - db
    networks:
      - hlptt-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: hlptt-pma
    environment:
      PMA_HOST: db
      PMA_PORT: 3306      
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    ports:
      - "8088:80"         
    networks:
      - hlptt-network

volumes:
  hlptt_db_data:

networks:
  hlptt-network:
    driver: bridge